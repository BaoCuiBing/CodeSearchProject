<div style="color: rgb(51, 51, 51); background-color: rgb(248, 251, 245); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 400; line-height: 20.8px; margin: 8px 0px 0px; padding: 6px 8px; border: 1px solid rgba(0, 0, 0, 0.06); border-bottom: 1px solid rgba(0, 0, 0, 0.06); border-left: 1px solid rgba(0, 0, 0, 0.06); border-right: 1px solid rgba(0, 0, 0, 0.06); border-top: 1px solid rgba(0, 0, 0, 0.06); text-align: start; width: 783.391px; height: 644.703px; vertical-align: baseline; display: block; position: relative; box-shadow: rgba(255, 255, 255, 0.8) 0px 1px 0px 0px inset; background: rgb(248, 251, 245) none repeat scroll 0% 0% / auto padding-box border-box; background-position: 0% 0%; background-repeat: repeat; list-style: outside none disc; transition: all; opacity: 1; box-sizing: content-box" class="example_code notranslate">
<html><br>
<body><br><br>
<script><br>
if (window.XMLHttpRequest)<br>
  {// code for IE7+, Firefox, Chrome, Opera, Safari<br>
  xmlhttp=new XMLHttpRequest();<br>
  }<br>
else<br>
  {// code for IE6, IE5<br>
  xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");<br>
  }<br>
xmlhttp.open("GET","cd_catalog.xml",false);<br>
xmlhttp.send();<br>
xmlDoc=xmlhttp.responseXML; <br><br>
document.write("<table border='1'>");<br>
var x=xmlDoc.getElementsByTagName("CD");<br>
for (i=0;i<x.length;i++)<br>
  { <br>
  document.write("<tr><td>");<br>
  document.write(x[i].getElementsByTagName("ARTIST")[0].childNodes[0].nodeValue);<br>
  document.write("</td><td>");<br>
  document.write(x[i].getElementsByTagName("TITLE")[0].childNodes[0].nodeValue);<br>
  document.write("</td></tr>");<br>
  }<br>
document.write("</table>");<br>
</script><br><br>
</body><br>
