<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文章详情</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div class="layui-container" style="margin-top:20px;">
        <form class="layui-form">
            <div class="layui-form-item"><input type="text" name="title" placeholder="标题" class="layui-input"></div>
            <div class="layui-form-item"><textarea name="content" placeholder="内容" class="layui-textarea"></textarea></div>
            <div class="layui-form-item"><button class="layui-btn" lay-submit>保存</button></div>
        </form>
    </div>
    <script src="/static/webs/layui/layui.js"></script>
</body>
</html>
