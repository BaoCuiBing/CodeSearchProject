<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>评论管理</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div class="layui-card" style="margin:15px;">
        <div class="layui-card-header">
            <div class="layui-form layui-row layui-col-space10">
                <div class="layui-col-md2"><input type="text" id="searchKeyword" placeholder="评论内容关键词" class="layui-input"></div>
                <div class="layui-col-md1"><select id="searchStatus"><option value="all">全部状态</option><option value="normal">正常</option><option value="hidden">已隐藏</option></select></div>
                <div class="layui-col-md1"><button class="layui-btn" id="searchBtn">搜索</button></div>
                <div class="layui-col-md8" style="text-align:right;"><button class="layui-btn layui-btn-danger layui-btn-sm" id="batchDelete">批量删除</button></div>
            </div>
        </div>
        <div class="layui-card-body"><table id="commentTable" lay-filter="commentTable"></table></div>
    </div>
    <script type="text/html" id="toolbarTpl">
        <a class="layui-btn layui-btn-xs" lay-event="detail">详情</a>
        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="reply">回复</a>
        <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="toggle">{{# if(d.status === 'hidden') { }}显示{{# } else { }}隐藏{{# } }}</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
    </script>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['table', 'form'], function() {
        var table = layui.table, form = layui.form, layer = layui.layer;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'comments'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载评论列表', 'comments');
        form.render('select');
        var tableIns = table.render({
            elem: '#commentTable', url: '/api/admin/comment/list', method: 'get', page: true, limit: 20, limits: [10, 20, 50, 100],
            where: { admin_id: adminId },
            request: { pageName: 'page', limitName: 'page_size' },
            parseData: function(res) { return { code: res.code, msg: res.msg, count: res.data.total, data: res.data.list }; },
            cols: [[
                {type: 'checkbox'}, {field: 'comment_id', title: 'ID', width: 80},
                {field: 'content', title: '内容', width: 300},
                {field: 'author_name', title: '作者', width: 120},
                {field: 'target_type', title: '目标类型', width: 90, templet: function(d) { return d.target_type === 'article' ? '文章' : d.target_type === 'question' ? '问题' : d.target_type; }},
                {field: 'status', title: '状态', width: 80, templet: function(d) { return d.status === 'hidden' ? '<span style="color:#FF5722;">已隐藏</span>' : '<span style="color:#5FB878;">正常</span>'; }},
                {field: 'created_at', title: '发布时间', width: 160},
                {title: '操作', width: 220, toolbar: '#toolbarTpl'}
            ]]
        });
        document.getElementById('searchBtn').onclick = function() {
            SendLog.log_info('搜索评论: ' + document.getElementById('searchKeyword').value, 'comments');
            tableIns.reload({ where: { admin_id: adminId, keyword: document.getElementById('searchKeyword').value, status: document.getElementById('searchStatus').value, page: 1 } });
        };
        table.on('tool(commentTable)', function(obj) {
            var d = obj.data;
            if (obj.event === 'detail') { SendLog.log_info('查看评论详情: ' + d.comment_id, 'comments'); lostoryOption.openDialog('评论详情', '/admin/dialogs/comment_detail.html?comment_id=' + d.comment_id, ['500px', '400px']); }
            if (obj.event === 'reply') { SendLog.log_info('回复评论: ' + d.comment_id, 'comments'); lostoryOption.openDialog('回复评论', '/admin/dialogs/comment_reply.html?comment_id=' + d.comment_id, ['500px', '300px']); }
            if (obj.event === 'toggle') { SendLog.log_info('切换评论状态: ' + d.comment_id, 'comments'); adminApi.comment.toggleStatus(d.comment_id).then(function(r) { layer.msg(r.msg); tableIns.reload(); SendLog.log_info('评论状态切换成功: ' + d.comment_id, 'comments'); }).catch(function(err) { SendLog.log_error('评论状态切换失败: ' + d.comment_id, 'comments'); }); }
            if (obj.event === 'delete') { SendLog.log_info('删除评论: ' + d.comment_id, 'comments'); lostoryOption.confirmDialog('确认删除该评论？', function() { adminApi.comment.delete(d.comment_id).then(function(r) { layer.msg(r.msg); tableIns.reload(); SendLog.log_info('评论删除成功: ' + d.comment_id, 'comments'); }).catch(function(err) { SendLog.log_error('评论删除失败: ' + d.comment_id, 'comments'); }); }); }
        });
        document.getElementById('batchDelete').onclick = function() {
            var checkStatus = table.checkStatus('commentTable');
            if (checkStatus.data.length === 0) { layer.msg('请先选择评论'); return; }
            var ids = [];
            checkStatus.data.forEach(function(d) { ids.push(d.comment_id); });
            SendLog.log_info('批量删除评论: ' + ids.join(','), 'comments');
            lostoryOption.confirmDialog('确认批量删除选中评论？', function() { adminApi.comment.batchDelete(ids).then(function(r) { layer.msg(r.msg); tableIns.reload(); SendLog.log_info('批量删除评论成功', 'comments'); }).catch(function(err) { SendLog.log_error('批量删除评论失败', 'comments'); }); });
        };
    });
    </script>
</body>
</html>
