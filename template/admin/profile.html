<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>管理员个人中心</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <div class="layui-card">
            <div class="layui-card-header">个人信息</div>
            <div class="layui-card-body">
                <form class="layui-form" lay-filter="profileForm">
                    <div class="layui-form-item"><label class="layui-form-label">用户名</label><div class="layui-input-block"><input type="text" name="username" class="layui-input" readonly></div></div>
                    <div class="layui-form-item"><label class="layui-form-label">邮箱</label><div class="layui-input-block"><input type="text" name="email" class="layui-input" readonly></div></div>
                    <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" type="button" id="editProfileBtn">编辑</button></div></div>
                </form>
            </div>
        </div>
        <div class="layui-card" style="margin-top:15px;">
            <div class="layui-card-header">修改密码</div>
            <div class="layui-card-body"><button class="layui-btn layui-btn-warm" type="button" id="changePwdBtn">修改密码</button></div>
        </div>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'profile'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载个人信息', 'profile');
        adminApi.auth.getMe().then(function(res) {
            if (res.code === 200) { form.val('profileForm', { username: res.data.username, email: res.data.email || '' }); SendLog.log_info('个人信息加载成功', 'profile'); }
            else { SendLog.log_warning('个人信息加载失败: ' + res.msg, 'profile'); }
        }).catch(function(err) { SendLog.log_error('个人信息请求异常: ' + err.message, 'profile'); });
        document.getElementById('editProfileBtn').onclick = function() {
            SendLog.log_info('打开编辑个人信息弹窗', 'profile');
            lostoryOption.openDialog('编辑个人信息', '/admin/dialogs/profile_edit.html', ['500px', '300px']);
        };
        document.getElementById('changePwdBtn').onclick = function() {
            SendLog.log_info('打开修改密码弹窗', 'profile');
            lostoryOption.openDialog('修改密码', '/admin/dialogs/profile_change_pwd.html', ['500px', '350px']);
        };
    });
    </script>
</body>
</html>
