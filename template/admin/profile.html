<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员个人中心</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div class="layui-container" style="margin-top:20px;">
        <form class="layui-form">
            <div class="layui-form-item"><label class="layui-form-label">用户名</label><div class="layui-input-block"><input type="text" name="username" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">邮箱</label><div class="layui-input-block"><input type="text" name="email" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">新密码</label><div class="layui-input-block"><input type="password" name="password" class="layui-input"></div></div>
            <div class="layui-form-item"><button class="layui-btn" lay-submit>保存</button></div>
        </form>
    </div>
    <script src="/static/webs/layui/layui.js"></script>
</body>
</html>
