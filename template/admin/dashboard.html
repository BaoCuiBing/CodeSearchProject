<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>管理后台 - 仪表盘</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
    <style>
        .dashboard-card { transition: all 0.3s; }
        .dashboard-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stat-number { font-size: 32px; font-weight: bold; color: #009688; }
        .stat-label { color: #999; font-size: 14px; margin-top: 5px; }
        .chart-container { min-height: 240px; }
        .layui-card-header { font-weight: bold; border-left: 3px solid #009688; padding-left: 10px; }
    </style>
</head>
<body>
    <div style="padding:15px;">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md3">
                <div class="layui-card dashboard-card">
                    <div class="layui-card-body" style="text-align:center;padding:20px;">
                        <div class="stat-number" id="totalUsers">-</div>
                        <div class="stat-label">用户总数</div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-card dashboard-card">
                    <div class="layui-card-body" style="text-align:center;padding:20px;">
                        <div class="stat-number" id="totalArticles" style="color:#1E9FFF;">-</div>
                        <div class="stat-label">内容总数</div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-card dashboard-card">
                    <div class="layui-card-body" style="text-align:center;padding:20px;">
                        <div class="stat-number" id="activeToday" style="color:#5FB878;">-</div>
                        <div class="stat-label">今日活跃</div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-card dashboard-card">
                    <div class="layui-card-body" style="text-align:center;padding:20px;">
                        <div class="stat-number" id="pendingReports" style="color:#FF5722;">-</div>
                        <div class="stat-label">待处理举报</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space15" style="margin-top:15px;">
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">近7日新增</div>
                    <div class="layui-card-body">
                        <table class="layui-table" lay-skin="line">
                            <thead><tr><th>指标</th><th>数量</th></tr></thead>
                            <tbody>
                                <tr><td><i class="layui-icon layui-icon-user" style="color:#009688;"></i> 新用户</td><td id="newUsers">-</td></tr>
                                <tr><td><i class="layui-icon layui-icon-file" style="color:#1E9FFF;"></i> 新文章</td><td id="newArticles">-</td></tr>
                                <tr><td><i class="layui-icon layui-icon-help" style="color:#FFB800;"></i> 新问题</td><td id="newQuestions">-</td></tr>
                                <tr><td><i class="layui-icon layui-icon-reply-fill" style="color:#5FB878;"></i> 新评论</td><td id="newComments">-</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">总体统计</div>
                    <div class="layui-card-body">
                        <table class="layui-table" lay-skin="line">
                            <thead><tr><th>指标</th><th>数量</th></tr></thead>
                            <tbody>
                                <tr><td><i class="layui-icon layui-icon-eye" style="color:#009688;"></i> 总浏览量</td><td id="totalViews">-</td></tr>
                                <tr><td><i class="layui-icon layui-icon-dialogue" style="color:#1E9FFF;"></i> 总评论数</td><td id="totalComments">-</td></tr>
                                <tr><td><i class="layui-icon layui-icon-help" style="color:#FFB800;"></i> 总问题数</td><td id="totalQuestions">-</td></tr>
                                <tr><td><i class="layui-icon layui-icon-chart" style="color:#5FB878;"></i> 近7日浏览</td><td id="newViews">-</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space15" style="margin-top:15px;">
            <div class="layui-col-md4">
                <div class="layui-card">
                    <div class="layui-card-header">用户增长</div>
                    <div class="layui-card-body chart-container" id="userStats"></div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-card">
                    <div class="layui-card-header">内容趋势</div>
                    <div class="layui-card-body chart-container" id="contentStats"></div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-card">
                    <div class="layui-card-header">活跃度</div>
                    <div class="layui-card-body chart-container" id="activeStats"></div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space15" style="margin-top:15px;">
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">搜索关键词TOP10</div>
                    <div class="layui-card-body">
                        <table class="layui-table" lay-skin="line" id="keywordTable">
                            <thead><tr><th>关键词</th><th>搜索次数</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">热门标签</div>
                    <div class="layui-card-body">
                        <table class="layui-table" lay-skin="line" id="hotTagTable">
                            <thead><tr><th>标签</th><th>关联内容</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/echarts/echarts.min.js"></script>
    <script src="/static/webs/echarts/macarons.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['element'], function() {
        var element = layui.element;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'dashboard'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载仪表盘数据', 'dashboard');
        adminApi.stats.getDashboard('week').then(function(res) {
            if (res.code === 200) {
                var d = res.data.summary;
                document.getElementById('totalUsers').innerText = d.total_users;
                document.getElementById('totalArticles').innerText = d.total_articles;
                document.getElementById('activeToday').innerText = d.active_users_today;
                document.getElementById('pendingReports').innerText = d.reported_items;
                document.getElementById('newUsers').innerText = d.new_users;
                document.getElementById('newArticles').innerText = d.new_articles;
                document.getElementById('newQuestions').innerText = d.new_questions;
                document.getElementById('newComments').innerText = d.new_comments;
                document.getElementById('totalViews').innerText = d.total_views;
                document.getElementById('totalComments').innerText = d.total_comments;
                document.getElementById('totalQuestions').innerText = d.total_questions;
                document.getElementById('newViews').innerText = d.new_views;
                SendLog.log_info('仪表盘数据加载成功', 'dashboard');
            } else { SendLog.log_warning('仪表盘数据加载失败: ' + res.msg, 'dashboard'); }
        }).catch(function(err) { SendLog.log_error('仪表盘请求异常: ' + err.message, 'dashboard'); });
        adminApi.stats.getUsers('month').then(function(res) {
            if (res.code === 200) {
                var d = res.data.overview;
                var chart = echarts.init(document.getElementById('userStats'), 'macarons');
                chart.setOption({
                    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                    legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 12 } },
                    series: [{
                        type: 'pie', radius: ['40%', '65%'], center: ['35%', '50%'],
                        avoidLabelOverlap: false,
                        label: { show: false },
                        emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold' } },
                        data: [
                            { value: d.total_users, name: '总用户' },
                            { value: d.active_users, name: '活跃用户' },
                            { value: d.new_users_month, name: '本月新增' },
                            { value: d.verified_users, name: '已认证' },
                            { value: d.banned_users, name: '封禁用户' }
                        ]
                    }]
                });
                SendLog.log_info('用户统计加载成功', 'dashboard');
            } else { SendLog.log_warning('用户统计加载失败: ' + res.msg, 'dashboard'); }
        }).catch(function(err) { SendLog.log_error('用户统计请求异常: ' + err.message, 'dashboard'); });
        adminApi.stats.getContent('month').then(function(res) {
            if (res.code === 200) {
                var d = res.data.overview;
                var chart = echarts.init(document.getElementById('contentStats'), 'macarons');
                chart.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'category', data: ['文章', '问题', '评论', '今日发布', '本周发布'], axisLabel: { fontSize: 11 } },
                    yAxis: { type: 'value' },
                    series: [{ type: 'bar', barWidth: '50%', data: [d.total_articles, d.total_questions, d.total_comments, d.published_today, d.published_week], itemStyle: { borderRadius: [4, 4, 0, 0] } }]
                });
                SendLog.log_info('内容统计加载成功', 'dashboard');
            } else { SendLog.log_warning('内容统计加载失败: ' + res.msg, 'dashboard'); }
        }).catch(function(err) { SendLog.log_error('内容统计请求异常: ' + err.message, 'dashboard'); });
        adminApi.stats.getDashboard('week').then(function(res) {
            if (res.code === 200) {
                var d = res.data.summary;
                var chart = echarts.init(document.getElementById('activeStats'), 'macarons');
                chart.setOption({
                    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                    legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 12 } },
                    series: [{
                        type: 'pie', radius: '60%', center: ['35%', '50%'],
                        label: { show: true, formatter: '{b}\n{c}' },
                        data: [
                            { value: d.active_users_today, name: '今日活跃' },
                            { value: d.total_views, name: '总浏览量' },
                            { value: d.new_views, name: '近7日浏览' },
                            { value: d.reported_items, name: '待处理举报' }
                        ]
                    }]
                });
                SendLog.log_info('活跃度统计加载成功', 'dashboard');
            } else { SendLog.log_warning('活跃度统计加载失败: ' + res.msg, 'dashboard'); }
        }).catch(function(err) { SendLog.log_error('活跃度统计请求异常: ' + err.message, 'dashboard'); });
        adminApi.stats.getSearchKeywords('week', 10).then(function(res) {
            if (res.code === 200) {
                var tbody = document.querySelector('#keywordTable tbody');
                tbody.innerHTML = '';
                res.data.top_keywords.forEach(function(k, i) { tbody.innerHTML += '<tr><td><span class="layui-badge' + (i < 3 ? ' layui-bg-green' : ' layui-bg-gray') + '">' + (i + 1) + '</span> ' + k.keyword + '</td><td>' + k.search_count + '</td></tr>'; });
                SendLog.log_info('搜索关键词加载成功', 'dashboard');
            } else { SendLog.log_warning('搜索关键词加载失败: ' + res.msg, 'dashboard'); }
        }).catch(function(err) { SendLog.log_error('搜索关键词请求异常: ' + err.message, 'dashboard'); });
        adminApi.tag.getStatsOverview().then(function(res) {
            if (res.code === 200) {
                var tbody = document.querySelector('#hotTagTable tbody');
                tbody.innerHTML = '';
                res.data.top_tags.forEach(function(t, i) { tbody.innerHTML += '<tr><td><span class="layui-badge' + (i < 3 ? ' layui-bg-blue' : ' layui-bg-gray') + '">' + (i + 1) + '</span> ' + t.name + '</td><td>' + t.post_count + '</td></tr>'; });
                SendLog.log_info('热门标签加载成功', 'dashboard');
            } else { SendLog.log_warning('热门标签加载失败: ' + res.msg, 'dashboard'); }
        }).catch(function(err) { SendLog.log_error('热门标签请求异常: ' + err.message, 'dashboard'); });
    });
    </script>
</body>
</html>
