<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>添加分类</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="categoryCreateForm">
            <div class="layui-form-item"><label class="layui-form-label">分类名称</label><div class="layui-input-block"><input type="text" name="name" lay-verify="required" placeholder="请输入分类名称" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">分类描述</label><div class="layui-input-block"><textarea name="description" placeholder="请输入分类描述" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item"><label class="layui-form-label">排序</label><div class="layui-input-block"><input type="number" name="sort" value="0" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="createCategory">创建</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, L = parent.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载添加分类页面', 'category_create');
        form.on('submit(createCategory)', function(data) {
            var d = data.field;
            d.sort = parseInt(d.sort) || 0;
            SendLog.log_info('创建分类: ' + d.name, 'category_create');
            adminApi.category.create(d).then(function(r) {
                L.msg(r.msg);
                SendLog.log_info('分类创建成功: ' + d.name, 'category_create');
                parent.layui.table.reload('categoryTable');
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
            }).catch(function(err) {
                L.msg('创建失败');
                SendLog.log_error('分类创建失败', 'category_create');
            });
            return false;
        });
    });
    </script>
</body>
</html>
