<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>APP关于页面设置</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
    <style>
        .section-title { font-size: 14px; font-weight: bold; color: #333; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 1px solid #eee; }
        .item-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
        .item-row input { flex: 1; }
        .item-row .layui-btn { flex-shrink: 0; }
        .fixed-item { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .fixed-item .label { width: 100px; text-align: right; color: #666; font-size: 14px; flex-shrink: 0; }
        .fixed-item .input-wrap { flex: 1; }
        .fixed-item textarea { width: 100%; height: 80px; resize: vertical; }
    </style>
</head>
<body>
    <div style="padding:15px;">
        <div class="section-title">信息列表</div>
        <div class="fixed-item">
            <span class="label">官方网站</span>
            <div class="input-wrap"><input type="text" id="info_website" class="layui-input" placeholder="官方网站"></div>
        </div>
        <div class="fixed-item">
            <span class="label">GitHub</span>
            <div class="input-wrap"><input type="text" id="info_github" class="layui-input" placeholder="GitHub地址"></div>
        </div>
        <div class="fixed-item">
            <span class="label">联系我们</span>
            <div class="input-wrap"><input type="text" id="info_contact" class="layui-input" placeholder="联系方式"></div>
        </div>
        <div class="fixed-item">
            <span class="label">用户协议</span>
            <div class="input-wrap"><textarea id="info_agreement" class="layui-textarea" placeholder="用户协议内容"></textarea></div>
        </div>
        <div class="fixed-item">
            <span class="label">隐私政策</span>
            <div class="input-wrap"><textarea id="info_privacy" class="layui-textarea" placeholder="隐私政策内容"></textarea></div>
        </div>
        <div class="section-title">技术栈</div>
        <div id="techStackContainer"></div>
        <button type="button" class="layui-btn layui-btn-xs layui-btn-normal" onclick="addTechItem()" style="margin-top:5px;">+ 添加技术栈</button>
        <div style="margin-top:20px;text-align:center;">
            <button type="button" class="layui-btn" onclick="saveAboutConfig()">保存设置</button>
        </div>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['layer'], function() {
        var layer = layui.layer;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'settings_about_info'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载APP关于页面设置', 'settings_about_info');
        var aboutConfig = {info_list: [], tech_stack: []};
        adminApi.system.getSettings('about_config').then(function(res) {
            if (res.code === 200 && res.data.length > 0) {
                try { aboutConfig = JSON.parse(res.data[0].value); } catch(e) { aboutConfig = {info_list: [], tech_stack: []}; }
            }
            renderAll();
            SendLog.log_info('APP关于页面配置加载成功', 'settings_about_info');
        }).catch(function(err) { SendLog.log_error('APP关于页面配置加载异常: ' + err.message, 'settings_about_info'); renderAll(); });
        function renderAll() {
            renderInfoList();
            renderTechStack();
        }
        function renderInfoList() {
            var list = aboutConfig.info_list || [];
            var map = {};
            list.forEach(function(item) { map[item.title] = item.value; });
            document.getElementById('info_website').value = map['官方网站'] || '';
            document.getElementById('info_github').value = map['GitHub'] || '';
            document.getElementById('info_contact').value = map['联系我们'] || '';
            document.getElementById('info_agreement').value = map['用户协议'] || '';
            document.getElementById('info_privacy').value = map['隐私政策'] || '';
        }
        function renderTechStack() {
            var container = document.getElementById('techStackContainer');
            var html = '';
            (aboutConfig.tech_stack || []).forEach(function(item, i) {
                html += '<div class="item-row"><input type="text" class="layui-input" placeholder="名称" value="' + (item.name || '') + '" data-index="' + i + '" data-field="name"><input type="text" class="layui-input" placeholder="链接" value="' + (item.url || '') + '" data-index="' + i + '" data-field="url"><button type="button" class="layui-btn layui-btn-danger layui-btn-xs" onclick="removeTechItem(' + i + ')">删除</button></div>';
            });
            container.innerHTML = html;
        }
        window.addTechItem = function() {
            aboutConfig.tech_stack = aboutConfig.tech_stack || [];
            aboutConfig.tech_stack.push({name: '', url: ''});
            renderTechStack();
        };
        window.removeTechItem = function(index) {
            aboutConfig.tech_stack.splice(index, 1);
            renderTechStack();
        };
        window.saveAboutConfig = function() {
            aboutConfig.info_list = [
                {title: '官方网站', value: document.getElementById('info_website').value},
                {title: 'GitHub', value: document.getElementById('info_github').value},
                {title: '联系我们', value: document.getElementById('info_contact').value},
                {title: '用户协议', value: document.getElementById('info_agreement').value},
                {title: '隐私政策', value: document.getElementById('info_privacy').value}
            ];
            var techInputs = document.querySelectorAll('#techStackContainer input');
            techInputs.forEach(function(input) {
                var idx = parseInt(input.getAttribute('data-index'));
                var field = input.getAttribute('data-field');
                if (aboutConfig.tech_stack[idx]) { aboutConfig.tech_stack[idx][field] = input.value; }
            });
            var value = JSON.stringify(aboutConfig);
            adminApi.system.updateSettings('about_config', value).then(function(res) {
                if (res.code === 200) {
                    layer.msg('保存成功', {icon: 1});
                    if (parent.updateAboutConfigDesc) { parent.updateAboutConfigDesc(value); }
                    SendLog.log_info('APP关于页面配置保存成功', 'settings_about_info');
                } else { layer.msg('保存失败: ' + res.msg, {icon: 2}); }
            }).catch(function(err) { layer.msg('请求异常: ' + err.message, {icon: 2}); });
        };
    });
    </script>
</body>
</html>
