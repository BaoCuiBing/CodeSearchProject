<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页轮播图设置</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
    <style>
        .carousel-preview { margin-bottom: 15px; }
        .carousel-preview .layui-carousel { width: 100%; height: 200px; }
        .carousel-preview .layui-carousel img { width: 100%; height: 100%; object-fit: cover; }
        .upload-area { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div style="padding:15px;">
        <div class="carousel-preview">
            <div class="layui-carousel" id="carouselPreview" lay-filter="carouselPreview">
                <div carousel-item id="carouselItems"><div><p style="text-align:center;line-height:200px;color:#999;">暂无轮播图</p></div></div>
            </div>
        </div>
        <div class="upload-area">
            <button type="button" class="layui-btn" id="uploadBtn"><i class="layui-icon">&#xe67c;</i>上传图片</button>
            <button type="button" class="layui-btn layui-btn-normal" onclick="saveCarousel()">保存设置</button>
        </div>
        <table class="layui-hide" id="carouselTable" lay-filter="carouselTable"></table>
    </div>
    <script type="text/html" id="tableBar">
        <a class="layui-btn layui-btn-xs" lay-event="up">上移</a>
        <a class="layui-btn layui-btn-xs" lay-event="down">下移</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    </script>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['carousel', 'table', 'upload', 'layer'], function() {
        var carousel = layui.carousel, table = layui.table, upload = layui.upload, layer = layui.layer;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'settings_carousel_imgs'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载轮播图设置', 'settings_carousel_imgs');
        var carouselData = [];
        adminApi.system.getSettings().then(function(res) {
            if (res.code === 200) {
                var data = {};
                res.data.forEach(function(s) { data[s.key] = s.value; });
                try { var parsed = JSON.parse(data.carousel_imgs); carouselData = parsed.imgs || []; } catch(e) { carouselData = []; }
                renderTable();
                renderCarousel();
                SendLog.log_info('轮播图加载成功', 'settings_carousel_imgs');
            } else { SendLog.log_warning('轮播图加载失败: ' + res.msg, 'settings_carousel_imgs'); }
        }).catch(function(err) { SendLog.log_error('轮播图请求异常: ' + err.message, 'settings_carousel_imgs'); });
        function renderTable() {
            table.render({
                elem: '#carouselTable',
                data: carouselData.map(function(url, i) { return {index: i + 1, url: url}; }),
                cols: [[
                    {field: 'index', title: '序号', width: 80, align: 'center'},
                    {field: 'url', title: '图片链接', minWidth: 200},
                    {title: '操作', width: 200, align: 'center', toolbar: '#tableBar'}
                ]],
                page: false
            });
        }
        function renderCarousel() {
            var itemsHtml = carouselData.length > 0 ? carouselData.map(function(url) { return '<div><img src="' + url + '"></div>'; }).join('') : '<div><p style="text-align:center;line-height:200px;color:#999;">暂无轮播图</p></div>';
            document.getElementById('carouselItems').innerHTML = itemsHtml;
            carousel.render({
                elem: '#carouselPreview',
                width: '100%',
                height: '200px',
                arrow: 'always',
                indicator: 'inside'
            });
        }
        upload.render({
            elem: '#uploadBtn',
            url: '/api/upload/file',
            data: {user_id: adminId},
            accept: 'images',
            exts: 'jpg|jpeg|png|gif|webp',
            done: function(res) {
                if (res.code === 200) {
                    carouselData.push(res.data.file_url);
                    renderTable();
                    renderCarousel();
                    SendLog.log_info('图片上传成功: ' + res.data.file_url, 'settings_carousel_imgs');
                } else { layer.msg('上传失败: ' + res.msg, {icon: 2}); }
            },
            error: function() { layer.msg('上传异常', {icon: 2}); }
        });
        table.on('tool(carouselTable)', function(obj) {
            var data = obj.data, layEvent = obj.event;
            if (layEvent === 'del') {
                layer.confirm('确定删除该图片？', {zIndex: 20000000}, function(index) {
                    carouselData.splice(data.index - 1, 1);
                    renderTable();
                    renderCarousel();
                    layer.close(index);
                    SendLog.log_info('删除轮播图: ' + data.url, 'settings_carousel_imgs');
                });
            } else if (layEvent === 'up') {
                if (data.index > 1) {
                    var idx = data.index - 1;
                    var temp = carouselData[idx - 1];
                    carouselData[idx - 1] = carouselData[idx];
                    carouselData[idx] = temp;
                    renderTable();
                    renderCarousel();
                }
            } else if (layEvent === 'down') {
                if (data.index < carouselData.length) {
                    var idx = data.index - 1;
                    var temp = carouselData[idx + 1];
                    carouselData[idx + 1] = carouselData[idx];
                    carouselData[idx] = temp;
                    renderTable();
                    renderCarousel();
                }
            }
        });
        window.saveCarousel = function() {
            var newValue = JSON.stringify({imgs: carouselData});
            adminApi.system.updateSettings('carousel_imgs', newValue).then(function(res) {
                if (res.code === 200) {
                    SendLog.log_info('轮播图保存成功', 'settings_carousel_imgs');
                    try { window.top.updateCarouselDesc(newValue); } catch(e) {}
                    parent.layer.closeAll();
                } else { layer.msg('保存失败: ' + res.msg, {icon: 2}); }
            }).catch(function(err) { layer.msg('请求异常: ' + err.message, {icon: 2}); });
        };
    });
    </script>
</body>
</html>
