<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>编辑文章</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="articleEditForm">
            <input type="hidden" name="post_id" id="postId">
            <div class="layui-form-item"><label class="layui-form-label">标题</label><div class="layui-input-block"><input type="text" name="title" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">摘要</label><div class="layui-input-block"><textarea name="summary" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item layui-form-text"><label class="layui-form-label">内容</label><div class="layui-input-block"><textarea id="contentEditor" style="min-height:300px;"></textarea></div></div>
            <div class="layui-form-item"><label class="layui-form-label">分类</label><div class="layui-input-block"><select name="category_id" id="categorySelect"><option value="">请选择分类</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div></div>
            <div class="layui-form-item"><label class="layui-form-label">置顶</label><div class="layui-input-block"><input type="checkbox" name="is_top" lay-skin="switch" lay-text="是|否"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">封面图</label><div class="layui-input-block"><button type="button" class="layui-btn layui-btn-sm" id="uploadCoverBtn"><i class="layui-icon layui-icon-upload"></i>多图片上传</button><div class="layui-upload-list" id="coverPreview" style="margin-top:10px;"></div><input type="hidden" name="cover_image" id="coverImage"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="saveArticle">保存</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.extend({ tinymce: '/static/webs/layui_tinymce/layui_exts/tinymce/tinymce' });
    layui.use(['tinymce', 'form', 'upload', 'jquery'], function() {
        var t = layui.tinymce, form = layui.form, upload = layui.upload, L = parent.layer, $ = layui.$;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var postId = urlParams.get('post_id');
        document.getElementById('postId').value = postId || '';
        SendLog.log_info('加载编辑文章页面: ' + postId, 'article_edit');
        var coverUrls = [];
        var articleData = null;
        upload.render({
            elem: '#uploadCoverBtn',
            url: '/api/upload/file',
            multiple: true,
            accept: 'images',
            exts: 'jpg|png|gif|jpeg|webp',
            data: { user_id: adminId },
            before: function(obj) { obj.preview(function(index, file, result) { var preview = document.getElementById('coverPreview'); var div = document.createElement('div'); div.className = 'layui-upload-img'; div.style.cssText = 'display:inline-block;margin:5px;position:relative;'; div.innerHTML = '<img src="' + result + '" style="width:100px;height:100px;object-fit:cover;"><span class="layui-icon layui-icon-close" style="position:absolute;top:0;right:0;cursor:pointer;color:red;" data-index="' + index + '"></span>'; preview.appendChild(div); }); },
            done: function(res) { if (res.code === 200) { coverUrls.push(res.data.file_url); document.getElementById('coverImage').value = JSON.stringify({ imgs: coverUrls }); } else { L.msg(res.msg || '上传失败'); } },
            error: function() { L.msg('上传接口异常'); }
        });
        document.getElementById('coverPreview').addEventListener('click', function(e) { if (e.target.classList.contains('layui-icon-close')) { var idx = parseInt(e.target.getAttribute('data-index')); e.target.parentElement.remove(); coverUrls.splice(idx, 1); document.getElementById('coverImage').value = JSON.stringify({ imgs: coverUrls }); } });
        adminApi.category.getList({ page_size: 500 }).then(function(res) {
            if (res.code === 200) {
                var sel = document.getElementById('categorySelect');
                res.data.list.forEach(function(c) { var opt = document.createElement('option'); opt.value = c.category_id; opt.text = c.name; sel.appendChild(opt); });
                form.render('select');
                if (postId) {
                    adminApi.article.getDetail(postId).then(function(r) {
                        if (r.code === 200) {
                            articleData = r.data;
                            form.val('articleEditForm', { post_id: articleData.post_id, title: articleData.title, summary: articleData.summary || '', category_id: articleData.category ? articleData.category.category_id : '', status: articleData.status, is_top: articleData.is_top });
                            if (articleData.cover_image) {
                                try { var coverData = typeof articleData.cover_image === 'string' ? JSON.parse(articleData.cover_image) : articleData.cover_image; coverUrls = coverData.imgs || []; document.getElementById('coverImage').value = typeof articleData.cover_image === 'string' ? articleData.cover_image : JSON.stringify(articleData.cover_image); var preview = document.getElementById('coverPreview'); coverUrls.forEach(function(url, i) { var div = document.createElement('div'); div.className = 'layui-upload-img'; div.style.cssText = 'display:inline-block;margin:5px;position:relative;'; div.innerHTML = '<img src="' + url + '" style="width:100px;height:100px;object-fit:cover;"><span class="layui-icon layui-icon-close" style="position:absolute;top:0;right:0;cursor:pointer;color:red;" data-index="' + i + '"></span>'; preview.appendChild(div); }); } catch(e) {}
                            }
                            SendLog.log_info('文章数据加载成功: ' + postId, 'article_edit');
                            initEditor();
                        }
                    });
                } else {
                    initEditor();
                }
            }
        });
        function initEditor() {
            t.render({ elem: '#contentEditor', height: 700, images_upload_url: '/api/upload/file', init_instance_callback: function(editor) { if (articleData && articleData.content) { editor.setContent(articleData.content); } } });
        }
        form.on('submit(saveArticle)', function(data) {
            var d = data.field;
            var editor = t.get('#contentEditor');
            d.content = editor ? editor.getContent() : '';
            d.is_top = d.is_top ? true : false;
            SendLog.log_info('保存文章: ' + data.field.post_id, 'article_edit');
            adminApi.article.edit(d).then(function(r) { L.msg(r.msg); SendLog.log_info('文章保存成功: ' + data.field.post_id, 'article_edit'); parent.layui.table.reload('articleTable'); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }).catch(function(err) { SendLog.log_error('文章保存失败', 'article_edit'); });
            return false;
        });
    });
    </script>
</body>
</html>
