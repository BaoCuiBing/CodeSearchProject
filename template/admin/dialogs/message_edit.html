<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>编辑消息</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="msgEditForm">
            <input type="hidden" name="system_message_id" id="msgId">
            <div class="layui-form-item"><label class="layui-form-label">标题</label><div class="layui-input-block"><input type="text" name="title" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="saveMsg">保存</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var msgId = urlParams.get('system_message_id');
        var title = urlParams.get('title') || '';
        document.getElementById('msgId').value = msgId || '';
        form.val('msgEditForm', { system_message_id: msgId || '', title: title });
        form.on('submit(saveMsg)', function(data) {
            SendLog.log_info('编辑消息: ' + data.field.system_message_id, 'message_edit');
            adminApi.message.edit(data.field).then(function(r) { layer.msg(r.msg); SendLog.log_info('消息编辑成功: ' + data.field.system_message_id, 'message_edit'); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }).catch(function(err) { SendLog.log_error('消息编辑失败', 'message_edit'); });
            return false;
        });
    });
    </script>
</body>
</html>
