<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>消息详情</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <table class="layui-table">
            <tr><td>ID</td><td id="d_msg_id"></td></tr>
            <tr><td>发送用户</td><td id="d_from_user"></td></tr>
            <tr><td>接收用户</td><td id="d_to_user"></td></tr>
            <tr><td>内容</td><td id="d_content"></td></tr>
            <tr><td>已读状态</td><td id="d_is_read"></td></tr>
            <tr><td>发送时间</td><td id="d_created_at"></td></tr>
        </table>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(function() {
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var msgId = urlParams.get('message_id');
        if (!msgId) { return; }
        SendLog.log_info('加载私信详情: ' + msgId, 'message_detail');
        adminApi.privateMessage.getDetail(msgId).then(function(res) {
            if (res.code === 200) {
                var m = res.data;
                document.getElementById('d_msg_id').innerText = m.message_id;
                document.getElementById('d_from_user').innerText = m.from_user ? m.from_user.username : '-';
                document.getElementById('d_to_user').innerText = m.to_user ? m.to_user.username : '-';
                document.getElementById('d_content').innerText = m.content;
                document.getElementById('d_is_read').innerText = m.is_read ? '已读' : '未读';
                document.getElementById('d_created_at').innerText = m.created_at || '-';
                SendLog.log_info('私信详情加载成功: ' + msgId, 'message_detail');
            }
        }).catch(function(err) { SendLog.log_error('私信详情请求异常: ' + err.message, 'message_detail'); });
    });
    </script>
</body>
</html>
