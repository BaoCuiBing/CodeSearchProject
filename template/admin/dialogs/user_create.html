<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增用户</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="userCreateForm">
            <div class="layui-form-item"><label class="layui-form-label">用户名</label><div class="layui-input-block"><input type="text" name="username" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">账号</label><div class="layui-input-block"><input type="text" name="usernumber" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">邮箱</label><div class="layui-input-block"><input type="text" name="email" lay-verify="email" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">密码</label><div class="layui-input-block"><input type="password" name="password" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">角色</label><div class="layui-input-block"><select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="createUser">创建</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        form.on('submit(createUser)', function(data) {
            SendLog.log_info('创建用户: ' + data.field.username, 'user_create');
            adminApi.user.create(data.field).then(function(r) { layer.msg(r.msg); SendLog.log_info('用户创建成功: ' + data.field.username, 'user_create'); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }).catch(function(err) { SendLog.log_error('用户创建失败', 'user_create'); });
            return false;
        });
    });
    </script>
</body>
</html>
