<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>邮件测试</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="emailTestForm">
            <div class="layui-form-item"><label class="layui-form-label">测试邮箱</label><div class="layui-input-block"><input type="text" name="email" lay-verify="required" placeholder="请输入测试邮箱" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="sendTest">发送测试邮件</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        form.on('submit(sendTest)', function(data) {
            SendLog.log_info('发送测试邮件: ' + data.field.email, 'settings_email');
            adminApi.system.testEmail(data.field.email).then(function(r) { layer.msg(r.msg); SendLog.log_info('测试邮件发送成功', 'settings_email'); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }).catch(function(err) { SendLog.log_error('测试邮件发送失败', 'settings_email'); });
            return false;
        });
    });
    </script>
</body>
</html>
