<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>标签详情</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <table class="layui-table">
            <tbody>
                <tr><td width="100">标签ID</td><td id="d_tag_id"></td></tr>
                <tr><td>标签名称</td><td id="d_name"></td></tr>
                <tr><td>别名</td><td id="d_slug"></td></tr>
                <tr><td>描述</td><td id="d_description"></td></tr>
                <tr><td>颜色</td><td id="d_color"></td></tr>
                <tr><td>热门</td><td id="d_is_hot"></td></tr>
                <tr><td>推荐</td><td id="d_is_recommend"></td></tr>
                <tr><td>状态</td><td id="d_status"></td></tr>
                <tr><td>排序</td><td id="d_sort_order"></td></tr>
                <tr><td>关联内容</td><td id="d_post_count"></td></tr>
                <tr><td>创建时间</td><td id="d_created_at"></td></tr>
                <tr><td>更新时间</td><td id="d_updated_at"></td></tr>
            </tbody>
        </table>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(function() {
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var tagId = urlParams.get('tag_id');
        SendLog.log_info('加载标签详情: ' + tagId, 'tag_detail');
        adminApi.tag.getDetail(tagId).then(function(res) {
            if (res.code === 200) {
                var d = res.data;
                document.getElementById('d_tag_id').textContent = d.tag_id || '-';
                document.getElementById('d_name').textContent = d.name || '-';
                document.getElementById('d_slug').textContent = d.slug || '-';
                document.getElementById('d_description').textContent = d.description || '-';
                document.getElementById('d_color').innerHTML = d.color ? '<span style="display:inline-block;width:20px;height:20px;background-color:' + d.color + ';border:1px solid #eee;vertical-align:middle;"></span> ' + d.color : '-';
                document.getElementById('d_is_hot').textContent = d.is_hot ? '是' : '否';
                document.getElementById('d_is_recommend').textContent = d.is_recommend ? '是' : '否';
                document.getElementById('d_status').textContent = d.status === 'active' ? '启用' : '禁用';
                document.getElementById('d_sort_order').textContent = d.sort_order || 0;
                document.getElementById('d_post_count').textContent = d.post_count || 0;
                document.getElementById('d_created_at').textContent = d.created_at || '-';
                document.getElementById('d_updated_at').textContent = d.updated_at || '-';
                SendLog.log_info('标签详情加载成功: ' + tagId, 'tag_detail');
            }
        });
    });
    </script>
</body>
</html>
