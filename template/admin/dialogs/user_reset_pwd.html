<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>重置密码</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="resetPwdForm">
            <input type="hidden" name="user_id" id="userId">
            <div class="layui-form-item"><label class="layui-form-label">新密码</label><div class="layui-input-block"><input type="password" name="password" lay-verify="required" placeholder="至少6位" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn layui-btn-warm" lay-submit lay-filter="resetPwd">确认重置</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var userId = urlParams.get('user_id');
        document.getElementById('userId').value = userId || '';
        form.on('submit(resetPwd)', function(data) {
            adminApi.user.resetPassword(data.field.user_id, data.field.password).then(function(r) { layer.msg(r.msg); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); });
            return false;
        });
    });
    </script>
</body>
</html>
