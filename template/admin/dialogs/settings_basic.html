<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>基本设置</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="basicSettingsForm">
            <div class="layui-form-item"><label class="layui-form-label">站点名称</label><div class="layui-input-block"><input type="text" name="site_name" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">站点描述</label><div class="layui-input-block"><textarea name="site_description" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="saveBasic">保存</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        adminApi.system.getSettings().then(function(res) {
            if (res.code === 200) {
                var data = {};
                res.data.forEach(function(s) { data[s.key] = s.value; });
                form.val('basicSettingsForm', data);
            }
        });
        form.on('submit(saveBasic)', function(data) {
            var d = data.field;
            Object.keys(d).forEach(function(k) { adminApi.system.updateSettings(k, d[k]); });
            layer.msg('保存成功');
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
            return false;
        });
    });
    </script>
</body>
</html>
