<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>封禁用户</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="userBanForm">
            <input type="hidden" name="user_id" id="userId">
            <div class="layui-form-item"><label class="layui-form-label">封禁原因</label><div class="layui-input-block"><textarea name="reason" lay-verify="required" placeholder="请输入封禁原因" class="layui-textarea"></textarea></div></div>
            <div class="layui-form-item"><label class="layui-form-label">封禁天数</label><div class="layui-input-block"><input type="number" name="days" value="7" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn layui-btn-danger" lay-submit lay-filter="banUser">确认封禁</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var userId = urlParams.get('user_id');
        document.getElementById('userId').value = userId || '';
        form.on('submit(banUser)', function(data) {
            SendLog.log_info('封禁用户: ' + data.field.user_id, 'user_ban');
            var d = data.field;
            adminApi.user.ban(d.user_id, 'ban', d.reason, parseInt(d.days)).then(function(r) { layer.msg(r.msg); SendLog.log_info('用户封禁成功: ' + d.user_id, 'user_ban'); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }).catch(function(err) { SendLog.log_error('用户封禁失败', 'user_ban'); });
            return false;
        });
    });
    </script>
</body>
</html>
