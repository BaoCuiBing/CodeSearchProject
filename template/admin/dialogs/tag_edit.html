<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑标签</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="tagEditForm">
            <input type="hidden" name="tag_id" id="tagId">
            <div class="layui-form-item"><label class="layui-form-label">标签名称</label><div class="layui-input-block"><input type="text" name="name" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="saveTag">保存</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var tagId = urlParams.get('tag_id');
        var tagName = urlParams.get('name') || '';
        document.getElementById('tagId').value = tagId || '';
        form.val('tagEditForm', { tag_id: tagId || '', name: tagName });
        form.on('submit(saveTag)', function(data) {
            var d = data.field;
            if (d.tag_id) { adminApi.tag.edit(d).then(function(r) { layer.msg(r.msg); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }); }
            else { adminApi.tag.create({ name: d.name }).then(function(r) { layer.msg(r.msg); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }); }
            return false;
        });
    });
    </script>
</body>
</html>
