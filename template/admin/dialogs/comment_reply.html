<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>回复评论</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="commentReplyForm">
            <input type="hidden" name="comment_id" id="commentId">
            <div class="layui-form-item"><label class="layui-form-label">回复内容</label><div class="layui-input-block"><textarea name="content" lay-verify="required" class="layui-textarea" style="min-height:150px;"></textarea></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="replyComment">回复</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, layer = layui.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        var urlParams = new URLSearchParams(window.location.search);
        var commentId = urlParams.get('comment_id');
        document.getElementById('commentId').value = commentId || '';
        form.on('submit(replyComment)', function(data) {
            adminApi.comment.reply(data.field).then(function(r) { layer.msg(r.msg); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); });
            return false;
        });
    });
    </script>
</body>
</html>
