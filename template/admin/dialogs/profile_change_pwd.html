<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>修改密码</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <form class="layui-form" lay-filter="changePwdForm">
            <div class="layui-form-item"><label class="layui-form-label">新密码</label><div class="layui-input-block"><input type="password" name="new_password" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><label class="layui-form-label">确认密码</label><div class="layui-input-block"><input type="password" name="confirm_password" lay-verify="required" class="layui-input"></div></div>
            <div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn layui-btn-warm" lay-submit lay-filter="doChangePwd">修改密码</button></div></div>
        </form>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['form'], function() {
        var form = layui.form, L = parent.layer;
        var adminId = localStorage.getItem('admin_id');
        if (!adminId) { parent.window.location.href = '/admin/login'; return; }
        adminApi.setAdminId(adminId);
        form.on('submit(doChangePwd)', function(data) {
            var d = data.field;
            if (d.new_password !== d.confirm_password) { SendLog.log_warning('两次密码不一致', 'profile_change_pwd'); L.msg('两次密码不一致'); return false; }
            SendLog.log_info('修改密码', 'profile_change_pwd');
            adminApi.auth.changePassword(d.new_password, d.confirm_password).then(function(r) { L.msg(r.msg); SendLog.log_info('密码修改成功', 'profile_change_pwd'); var index = parent.layer.getFrameIndex(window.name); parent.layer.close(index); }).catch(function(err) { SendLog.log_error('密码修改失败', 'profile_change_pwd'); });
            return false;
        });
    });
    </script>
</body>
</html>
