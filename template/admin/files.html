<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文件管理</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div class="layui-card" style="margin:15px;">
        <div class="layui-card-header">
            <div class="layui-form layui-row">
                <div class="layui-col-md2"><input type="text" id="searchKeyword" placeholder="文件名关键词" class="layui-input"></div>
                <div class="layui-col-md1"><button class="layui-btn" id="searchBtn">搜索</button></div>
                <div class="layui-col-md2"><button class="layui-btn layui-btn-normal" id="uploadBtn"><i class="layui-icon layui-icon-upload"></i> 上传文件</button></div>
            </div>
        </div>
        <div class="layui-card-body"><table id="fileTable" lay-filter="fileTable"></table></div>
    </div>
    <script type="text/html" id="toolbarTpl">
        <a class="layui-btn layui-btn-xs" lay-event="preview">预览</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
    </script>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['table', 'form', 'upload'], function() {
        var table = layui.table, form = layui.form, layer = layui.layer, upload = layui.upload;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'files'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载文件列表', 'files');
        form.render('select');
        var tableIns = table.render({
            elem: '#fileTable', url: '/api/admin/file/list', method: 'get', page: true, limit: 20, limits: [10, 20, 50, 100],
            where: { admin_id: adminId },
            request: { pageName: 'page', limitName: 'page_size' },
            parseData: function(res) { return { code: res.code, msg: res.msg, count: res.data.total, data: res.data.list }; },
            cols: [[
                {type: 'checkbox'}, {field: 'file_id', title: 'ID', width: 80},
                {field: 'filename', title: '文件名', width: 250},
                {field: 'file_type', title: '类型', width: 80},
                {field: 'file_size', title: '大小', width: 100, templet: function(d) { var s = d.file_size || 0; return s < 1024 ? s + 'B' : s < 1048576 ? (s / 1024).toFixed(1) + 'KB' : (s / 1048576).toFixed(1) + 'MB'; }},
                {field: 'file_url', title: '链接', width: 200, templet: function(d) { return '<a href="' + d.file_url + '" target="_blank">' + d.file_url + '</a>'; }},
                {field: 'created_at', title: '上传时间', width: 160},
                {title: '操作', width: 150, toolbar: '#toolbarTpl'}
            ]]
        });
        document.getElementById('searchBtn').onclick = function() {
            SendLog.log_info('搜索文件: ' + document.getElementById('searchKeyword').value, 'files');
            tableIns.reload({ where: { admin_id: adminId, keyword: document.getElementById('searchKeyword').value, page: 1 } });
        };
        document.getElementById('uploadBtn').onclick = function() {
            SendLog.log_info('打开上传文件弹窗', 'files');
            lostoryOption.openDialog('上传文件', '/admin/dialogs/file_upload.html', ['600px', '400px']);
        };
        table.on('tool(fileTable)', function(obj) {
            var d = obj.data;
            if (obj.event === 'preview') { SendLog.log_info('预览文件: ' + d.file_id, 'files'); window.open(d.file_url); }
            if (obj.event === 'delete') { SendLog.log_info('删除文件: ' + d.file_id, 'files'); lostoryOption.confirmDialog('确认删除该文件？', function() { adminApi.file.delete(d.file_id).then(function(r) { layer.msg(r.msg); tableIns.reload(); SendLog.log_info('文件删除成功: ' + d.file_id, 'files'); }).catch(function(err) { SendLog.log_error('文件删除失败: ' + d.file_id, 'files'); }); }); }
        });
    });
    </script>
</body>
</html>
