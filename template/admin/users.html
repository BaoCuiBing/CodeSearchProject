<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div class="layui-card" style="margin:15px;">
        <div class="layui-card-header">
            <div class="layui-form layui-row">
                <div class="layui-col-md2"><input type="text" id="searchKeyword" placeholder="用户名/账号关键词" class="layui-input"></div>
                <div class="layui-col-md1"><select id="searchStatus"><option value="all">全部状态</option><option value="active">正常</option><option value="banned">已封禁</option></select></div>
                <div class="layui-col-md1"><button class="layui-btn" id="searchBtn">搜索</button></div>
                <div class="layui-col-md1"><button class="layui-btn layui-btn-normal" id="addUserBtn">新增用户</button></div>
                <div class="layui-col-md1 layui-col-md-offset3"><button class="layui-btn layui-btn-danger layui-btn-sm" id="batchDelete">批量删除</button></div>
            </div>
        </div>
        <div class="layui-card-body"><table id="userTable" lay-filter="userTable"></table></div>
    </div>
    <script type="text/html" id="toolbarTpl">
        <a class="layui-btn layui-btn-xs" lay-event="detail">详情</a>
        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="toggle">{{# if(d.status === 'banned') { }}解封{{# } else { }}封禁{{# } }}</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
    </script>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script>
    layui.use(['table', 'form'], function() {
        var table = layui.table, form = layui.form, layer = layui.layer;
        if (!lostoryOption.checkAuth()) { return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        form.render('select');
        var tableIns = table.render({
            elem: '#userTable', url: '/api/admin/user/list', method: 'get', page: true, limit: 20, limits: [10, 20, 50, 100],
            where: { admin_id: adminId },
            request: { pageName: 'page', limitName: 'page_size' },
            parseData: function(res) { return { code: res.code, msg: res.msg, count: res.data.total, data: res.data.list }; },
            cols: [[
                {type: 'checkbox'}, {field: 'user_id', title: 'ID', width: 80},
                {field: 'username', title: '用户名', width: 120},
                {field: 'usernumber', title: '账号', width: 120},
                {field: 'email', title: '邮箱', width: 180},
                {field: 'status', title: '状态', width: 90, templet: function(d) { return d.status === 'banned' ? '<span style="color:#FF5722;">已封禁</span>' : '<span style="color:#5FB878;">正常</span>'; }},
                {field: 'created_at', title: '注册时间', width: 160},
                {title: '操作', width: 220, toolbar: '#toolbarTpl'}
            ]]
        });
        document.getElementById('searchBtn').onclick = function() {
            tableIns.reload({ where: { admin_id: adminId, keyword: document.getElementById('searchKeyword').value, status: document.getElementById('searchStatus').value, page: 1 } });
        };
        document.getElementById('addUserBtn').onclick = function() {
            lostoryOption.openDialog('新增用户', '/admin/dialogs/user_create.html', ['500px', '350px']);
        };
        table.on('tool(userTable)', function(obj) {
            var d = obj.data;
            if (obj.event === 'detail') { lostoryOption.openDialog('用户详情', '/admin/dialogs/user_detail.html?user_id=' + d.user_id, ['600px', '500px']); }
            if (obj.event === 'edit') { lostoryOption.openDialog('编辑用户', '/admin/dialogs/user_edit.html?user_id=' + d.user_id, ['500px', '300px']); }
            if (obj.event === 'toggle') { adminApi.user.toggleStatus(d.user_id).then(function(r) { layer.msg(r.msg); tableIns.reload(); }); }
            if (obj.event === 'delete') { lostoryOption.confirmDialog('确认删除该用户？', function() { adminApi.user.delete(d.user_id).then(function(r) { layer.msg(r.msg); tableIns.reload(); }); }); }
        });
        document.getElementById('batchDelete').onclick = function() {
            var checkStatus = table.checkStatus('userTable');
            if (checkStatus.data.length === 0) { layer.msg('请先选择用户'); return; }
            var ids = [];
            checkStatus.data.forEach(function(d) { ids.push(d.user_id); });
            lostoryOption.confirmDialog('确认批量删除选中用户？', function() { adminApi.user.batchDelete(ids).then(function(r) { layer.msg(r.msg); tableIns.reload(); }); });
        };
    });
    </script>
</body>
</html>
