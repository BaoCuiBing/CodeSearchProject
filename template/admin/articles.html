<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/imgs/favicon.ico" type="image/x-icon">
    <title>内容管理</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div class="layui-card" style="margin:15px;">
        <div class="layui-card-header">
            <div class="layui-form layui-row layui-col-space10">
                <div class="layui-col-md2"><input type="text" id="searchKeyword" placeholder="标题关键词" class="layui-input"></div>
                <div class="layui-col-md1"><select id="searchType"><option value="all">全部类型</option><option value="article">文章</option><option value="question">问题</option></select></div>
                <div class="layui-col-md1"><select id="searchStatus"><option value="all">全部状态</option><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">已隐藏</option></select></div>
                <div class="layui-col-md1"><button class="layui-btn" id="searchBtn">搜索</button></div>
                <div class="layui-col-md1"><button class="layui-btn layui-btn-normal" id="addArticleBtn">新建内容</button></div>
                <div class="layui-col-md6" style="text-align:right;"><button class="layui-btn layui-btn-danger layui-btn-sm" id="batchDelete">批量删除</button></div>
            </div>
        </div>
        <div class="layui-card-body"><table id="articleTable" lay-filter="articleTable"></table></div>
    </div>
    <script type="text/html" id="toolbarTpl">
        <a class="layui-btn layui-btn-xs" lay-event="detail">详情</a>
        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="toggle">{{# if(d.status === 'hidden') { }}显示{{# } else { }}隐藏{{# } }}</a>
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</a>
    </script>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['table', 'form'], function() {
        var table = layui.table, form = layui.form, L = lostoryOption.getLayer();
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'articles'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载内容列表', 'articles');
        form.render('select');
        var tableIns = table.render({
            elem: '#articleTable', url: '/api/admin/article/list', method: 'get', page: true, limit: 20, limits: [10, 20, 50, 100],
            where: { admin_id: adminId, status: 'all' },
            request: { pageName: 'page', limitName: 'page_size' },
            parseData: function(res) { return { code: 0, msg: res.msg, count: res.data.total, data: res.data.list }; },
            cols: [[
                {type: 'checkbox', fixed: 'left'}, {field: 'post_id', title: 'ID', width: '8%'},
                {field: 'title', title: '标题', width: '25%'},
                {field: 'post_type', title: '类型', width: '8%', templet: function(d) { return d.post_type === 'question' ? '问题' : '文章'; }},
                {field: 'author_name', title: '作者', width: '12%'},
                {field: 'status', title: '状态', width: '9%', templet: function(d) { return d.status === 'published' ? '<span style="color:#5FB878;">已发布</span>' : d.status === 'draft' ? '<span style="color:#FFB800;">草稿</span>' : '<span style="color:#FF5722;">已隐藏</span>'; }},
                {field: 'view_count', title: '浏览', width: '8%'},
                {field: 'created_at', title: '创建时间', width: '15%'},
                {title: '操作', width: '240', toolbar: '#toolbarTpl', fixed: 'right'}
            ]]
        });
        document.getElementById('searchBtn').onclick = function() {
            SendLog.log_info('搜索内容: ' + document.getElementById('searchKeyword').value, 'articles');
            tableIns.reload({ where: { admin_id: adminId, keyword: document.getElementById('searchKeyword').value, type: document.getElementById('searchType').value, status: document.getElementById('searchStatus').value, page: 1 } });
        };
        document.getElementById('addArticleBtn').onclick = function() {
            SendLog.log_info('打开新建内容弹窗', 'articles');
            lostoryOption.openDialog('新建内容', '/admin/dialogs/article_create.html', ['600px', '450px']);
        };
        table.on('tool(articleTable)', function(obj) {
            var d = obj.data;
            if (obj.event === 'detail') { SendLog.log_info('查看内容详情: ' + d.post_id, 'articles'); lostoryOption.openDialog('内容详情', '/admin/dialogs/article_detail.html?post_id=' + d.post_id, ['600px', '500px']); }
            if (obj.event === 'edit') { SendLog.log_info('编辑内容: ' + d.post_id, 'articles'); lostoryOption.openDialog('编辑内容', '/admin/dialogs/article_edit.html?post_id=' + d.post_id, ['600px', '400px']); }
            if (obj.event === 'toggle') { SendLog.log_info('切换内容状态: ' + d.post_id, 'articles'); adminApi.article.toggleStatus(d.post_id).then(function(r) { L.msg(r.msg); tableIns.reload(); SendLog.log_info('内容状态切换成功: ' + d.post_id, 'articles'); }).catch(function(err) { SendLog.log_error('内容状态切换失败: ' + d.post_id, 'articles'); }); }
            if (obj.event === 'delete') { SendLog.log_info('删除内容: ' + d.post_id, 'articles'); lostoryOption.confirmDialog('确认删除该内容？', function() { adminApi.article.delete(d.post_id).then(function(r) { L.msg(r.msg); tableIns.reload(); SendLog.log_info('内容删除成功: ' + d.post_id, 'articles'); }).catch(function(err) { SendLog.log_error('内容删除失败: ' + d.post_id, 'articles'); }); }); }
        });
        document.getElementById('batchDelete').onclick = function() {
            var checkStatus = table.checkStatus('articleTable');
            if (checkStatus.data.length === 0) { L.msg('请先选择内容'); return; }
            var ids = [];
            checkStatus.data.forEach(function(d) { ids.push(d.post_id); });
            SendLog.log_info('批量删除内容: ' + ids.join(','), 'articles');
            lostoryOption.confirmDialog('确认批量删除选中内容？', function() { adminApi.article.batchDelete(ids).then(function(r) { L.msg(r.msg); tableIns.reload(); SendLog.log_info('批量删除内容成功', 'articles'); }).catch(function(err) { SendLog.log_error('批量删除内容失败', 'articles'); }); });
        };
    });
    </script>
</body>
</html>
