<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据统计</title>
    <link rel="stylesheet" href="/static/webs/layui/css/layui.css">
</head>
<body>
    <div style="padding:15px;">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header">用户增长</div><div class="layui-card-body" id="userStats" style="min-height:200px;">加载中...</div></div></div>
            <div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header">内容趋势</div><div class="layui-card-body" id="contentStats" style="min-height:200px;">加载中...</div></div></div>
            <div class="layui-col-md4"><div class="layui-card"><div class="layui-card-header">活跃度</div><div class="layui-card-body" id="activeStats" style="min-height:200px;">加载中...</div></div></div>
        </div>
        <div class="layui-row layui-col-space15" style="margin-top:15px;">
            <div class="layui-col-md6"><div class="layui-card"><div class="layui-card-header">搜索关键词TOP10</div><div class="layui-card-body"><table class="layui-table" id="keywordTable"><thead><tr><th>关键词</th><th>搜索次数</th></tr></thead><tbody></tbody></table></div></div></div>
            <div class="layui-col-md6"><div class="layui-card"><div class="layui-card-header">热门标签</div><div class="layui-card-body"><table class="layui-table" id="hotTagTable"><thead><tr><th>标签</th><th>关联内容</th></tr></thead><tbody></tbody></table></div></div></div>
        </div>
    </div>
    <script src="/static/webs/layui/js/layui.js"></script>
    <script src="/static/webs/admin_pages/js/admin_request_api.js"></script>
    <script src="/static/webs/admin_pages/js/lostory_option.js"></script>
    <script src="/static/webs/admin_pages/js/send_log.js"></script>
    <script>
    layui.use(['element'], function() {
        var element = layui.element;
        if (!lostoryOption.checkAuth()) { SendLog.log_warning('权限检查失败', 'stats'); return; }
        var adminId = lostoryOption.getAdminId();
        adminApi.setAdminId(adminId);
        SendLog.log_info('加载数据统计', 'stats');
        adminApi.stats.getUsers('month').then(function(res) {
            if (res.code === 200) {
                var d = res.data.overview;
                document.getElementById('userStats').innerHTML = '<table class="layui-table"><tr><td>总用户</td><td>' + d.total_users + '</td></tr><tr><td>活跃用户</td><td>' + d.active_users + '</td></tr><tr><td>本月新增</td><td>' + d.new_users_month + '</td></tr><tr><td>已认证</td><td>' + d.verified_users + '</td></tr><tr><td>封禁用户</td><td>' + d.banned_users + '</td></tr></table>';
                SendLog.log_info('用户统计加载成功', 'stats');
            } else { SendLog.log_warning('用户统计加载失败: ' + res.msg, 'stats'); }
        }).catch(function(err) { SendLog.log_error('用户统计请求异常: ' + err.message, 'stats'); });
        adminApi.stats.getContent('month').then(function(res) {
            if (res.code === 200) {
                var d = res.data.overview;
                document.getElementById('contentStats').innerHTML = '<table class="layui-table"><tr><td>总文章</td><td>' + d.total_articles + '</td></tr><tr><td>总问题</td><td>' + d.total_questions + '</td></tr><tr><td>总评论</td><td>' + d.total_comments + '</td></tr><tr><td>今日发布</td><td>' + d.published_today + '</td></tr><tr><td>本周发布</td><td>' + d.published_week + '</td></tr></table>';
                SendLog.log_info('内容统计加载成功', 'stats');
            } else { SendLog.log_warning('内容统计加载失败: ' + res.msg, 'stats'); }
        }).catch(function(err) { SendLog.log_error('内容统计请求异常: ' + err.message, 'stats'); });
        adminApi.stats.getDashboard('week').then(function(res) {
            if (res.code === 200) {
                var d = res.data.summary;
                document.getElementById('activeStats').innerHTML = '<table class="layui-table"><tr><td>今日活跃</td><td>' + d.active_users_today + '</td></tr><tr><td>总浏览量</td><td>' + d.total_views + '</td></tr><tr><td>近7日浏览</td><td>' + d.new_views + '</td></tr><tr><td>待处理举报</td><td>' + d.reported_items + '</td></tr></table>';
                SendLog.log_info('活跃度统计加载成功', 'stats');
            } else { SendLog.log_warning('活跃度统计加载失败: ' + res.msg, 'stats'); }
        }).catch(function(err) { SendLog.log_error('活跃度统计请求异常: ' + err.message, 'stats'); });
        adminApi.stats.getSearchKeywords('week', 10).then(function(res) {
            if (res.code === 200) {
                var tbody = document.querySelector('#keywordTable tbody');
                tbody.innerHTML = '';
                res.data.top_keywords.forEach(function(k) { tbody.innerHTML += '<tr><td>' + k.keyword + '</td><td>' + k.search_count + '</td></tr>'; });
                SendLog.log_info('搜索关键词加载成功', 'stats');
            } else { SendLog.log_warning('搜索关键词加载失败: ' + res.msg, 'stats'); }
        }).catch(function(err) { SendLog.log_error('搜索关键词请求异常: ' + err.message, 'stats'); });
        adminApi.tag.getStatsOverview().then(function(res) {
            if (res.code === 200) {
                var tbody = document.querySelector('#hotTagTable tbody');
                tbody.innerHTML = '';
                res.data.top_tags.forEach(function(t) { tbody.innerHTML += '<tr><td>' + t.name + '</td><td>' + t.post_count + '</td></tr>'; });
                SendLog.log_info('热门标签加载成功', 'stats');
            } else { SendLog.log_warning('热门标签加载失败: ' + res.msg, 'stats'); }
        }).catch(function(err) { SendLog.log_error('热门标签请求异常: ' + err.message, 'stats'); });
    });
    </script>
</body>
</html>
